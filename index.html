<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#07060b">
<title>勇者自動探索RPG</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="style.css?v=20261002073838">
</head>
<body>
<canvas id="cv"></canvas>

<div id="hud">
  <div id="stat" class="panel">
    <div class="srow">
      <span class="lv">Lv <b id="lvTxt">1</b></span>
      <span class="floor" id="floorTxt">ホーム</span>
    </div>
    <div class="bar hpbar"><div id="hpLag"></div><div id="hpFill"></div><div id="shFill"></div><span id="hpTxt">0/0</span></div>
    <div class="bar expbar"><div id="expFill"></div></div>
    <div class="bar ultbar" id="ultBar" title="必殺技ゲージ（満タンで自動発動）"><div id="ultFill"></div><span id="ultTxt">必殺</span></div>
    <div class="pow" id="powBox"><span class="pl">総合力</span><b id="powTxt">0</b><span id="powUp"></span></div>
    <div class="srow sub"><span id="bestTxt">最深 --</span><span id="goldTxt" class="coinTxt">0枚</span></div>
    <div class="prog" id="progTxt"></div>
  </div>

  <div id="miniWrap" class="panel"><canvas id="mini"></canvas></div>

  <div id="bossBar" class="hidden"><div class="bn" id="bossName"></div><div class="bar"><div id="bossFill"></div></div></div>

  <div id="loot"></div>
  <div id="combo"><div class="cn" id="comboN">0</div><div class="cl">COMBO</div><div class="cbar"><div id="comboBar"></div></div><div class="cb" id="comboBonus"></div></div>

  <div id="skills"></div>

  <div id="menu">
    <button data-p="equip" title="装備 (E)">装備</button>
    <button data-p="skill" title="技 (K)">技</button>
    <button data-p="inv" title="所持品 (I)">所持品</button>
    <button data-p="set" title="設定">設定</button>
    <button id="retBtn" class="retBtn hidden" title="探索をやめてホームに戻る（同じ階から再開できます）">帰還</button>
    <button id="spdBtn" title="ゲーム速度">×1</button>
    <button id="bgmBtn" class="snd" title="BGMのON/OFF">♪BGM</button>
    <button id="seBtn" class="snd" title="効果音のON/OFF">効果音</button>
  </div>

  <div id="banner"><div class="b1" id="bannerTop"></div><div class="b2" id="bannerSub"></div></div>
  <div id="toast"></div>
  <div id="flash"></div>
  <div id="callout"><div class="coRays"></div><div class="coMain"></div><div class="coSub"></div></div>

  <div id="home" class="hidden">
    <div class="homeCard panel">
      <div class="homeTitle">ホーム</div>
      <div id="homeMsg" class="homeMsg"></div>
      <div id="homeStats" class="homeStats"></div>
      <div id="homeChar" class="homeChar"></div>
      <div class="homeTimer" id="homeTimer"></div>
      <div class="homeBtns">
        <button id="resumeBtn" class="primary hidden">続きから突入</button>
        <button id="departBtn" class="primary big">突入</button>
        <button id="waitBtn">ホームで待機: OFF</button>
      </div>
      <div class="homeBtns">
        <button id="hCharBtn">キャラ</button>
        <button id="hGachaBtn" class="gachaBtn">ガチャ</button>
      </div>
    </div>
  </div>
</div>

<div id="title">
  <div class="tInner">
    <canvas id="titleHero" width="144" height="144"></canvas>
    <div class="tLogo"><span class="tSmall">放置で潜れ、装備で変われ</span><span class="tMain">勇者自動探索RPG</span></div>
    <div class="tStart">クリックでスタート</div>
    <div class="tNote">♪ BGM・効果音が流れます（設定で音量を変更できます）</div>
  </div>
</div>

<div id="modal" class="hidden">
  <div class="win">
    <div class="whead"><div class="tabs" id="tabs"></div><button id="mClose" title="閉じる (Esc)">✕</button></div>
    <div id="mBody"></div>
  </div>
</div>

<div id="cutin" class="hidden"><div class="ciBand"><div class="ciPic" id="ciPic"></div><div class="ciTxt"><div class="ciSub" id="ciSub"></div><div class="ciName" id="ciName"></div></div></div></div>
<div id="gfx" class="hidden"></div>

<div id="confirm" class="hidden">
  <div class="cwin panel"><div id="cMsg"></div><div class="cbtns"><button id="cYes" class="danger">はい</button><button id="cNo">いいえ</button></div></div>
</div>

<script src="js/util.js?v=20261002073838"></script>
<script src="js/pixel3d.js?v=20261002073838"></script>
<script src="js/data.js?v=20261002073838"></script>
<script src="js/sprites.js?v=20261002073838"></script>
<script src="js/hero_src.js?v=20261002073838"></script>
<script src="js/hero_anim.js?v=20261002073838"></script>
<script src="js/pixelize.js?v=20261002073838"></script>
<script src="js/hero_run_src.js?v=20261002073838"></script>
<script src="js/hero_run.js?v=20261002073838"></script>
<script src="js/char_src.js?v=20261002073838"></script>
<script src="js/char_anim.js?v=20261002073838"></script>
<script src="js/char_rig.js?v=20261002073838"></script>
<script src="js/dungeon.js?v=20261002073838"></script>
<script src="js/art_world.js?v=20261002073838"></script>
<script src="js/art_enemies.js?v=20261002073838"></script>
<script src="js/audio.js?v=20261002073838"></script>
<script src="js/game.js?v=20261002073838"></script>
<script src="js/render.js?v=20261002073838"></script>
<script src="js/ui.js?v=20261002073838"></script>
<script src="js/ui_gacha.js?v=20261002073838"></script>
<script src="js/ui_home.js?v=20261002073838"></script>
<script src="js/ui_news.js?v=20261002073838"></script>
<script src="js/ui_ux.js?v=20261002073838"></script>
<script src="js/main.js?v=20261002073838"></script>
<script src="js/cloud.js?v=20261002073838"></script>
<script>
// 新しい版が公開されていたら、セーブしてから自動で読み込み直す（ホーム画面に追加したアプリでも最新になるように）
(function () {
  var V = '20261002073838';
  function check() {
    fetch('version.json?t=' + Date.now(), { cache: 'no-store' }).then(function (r) { return r.json(); }).then(function (j) {
      if (!j.v || j.v === V) return;
      if (window.G && G.S && G.S.mode === 'dungeon') return; // 探索中は邪魔しない（ホームにいる時や次に開いた時に更新）
      var k = 'yr_upd_' + j.v; try { if (sessionStorage.getItem(k)) return; sessionStorage.setItem(k, 1); } catch (e) { }
      try { G.save && G.save(); } catch (e) { }
      location.replace(location.pathname + '?v=' + j.v);
    }).catch(function () { });
  }
  check();
  document.addEventListener('visibilitychange', function () { if (!document.hidden) check(); });
  setInterval(check, 60 * 1000);
})();
</script></body>
</html>
